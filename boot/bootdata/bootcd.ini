[FREELOADER]
DefaultOS=LiveImg_Debug
TimeOut=10

[Display]
TitleText=ReactOS Boot Media
MinimalUI=Yes

[Operating Systems]
Setup="ReactOS Setup (Text Mode)"
Setup_NoLinux="ReactOS Setup (without Linux drivers)"
LiveImg="ReactOS Live Environment (Graphics Mode)"
LiveImg_RamDisk="ReactOS Live Environment (USB stick / RAM disk)"
Setup_RamDisk="ReactOS Setup (USB stick / RAM disk)"
LiveImg_NoLinux="ReactOS Live Environment (without Linux drivers)"
LiveImg_Gpu="ReactOS Live (experimental AMD GPU driver, test only)"
==
;; The entries below are for testing and development:
Setup_Debug="Setup (Debug)"
Setup_Screen="Setup (Screen Debug)"
LiveImg_Debug="Live (Debug)"
LiveImg_VBoxDebug="Live (VBox Debug)"
LiveImg_Screen="Live (Screen Debug)"
;; The following entry is an example template:
;LiveImg_LogFile="Live (Log file)"

[Setup]
BootType=ReactOSSetup

[Setup_Debug]
BootType=ReactOSSetup
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /NOGUIBOOT /SIFOPTIONSOVERRIDE

[Setup_Screen]
BootType=ReactOSSetup
Options=/DEBUG /DEBUGPORT=SCREEN /SIFOPTIONSOVERRIDE

[Setup_NoLinux]
BootType=ReactOSSetup
Options=/NOLINUXKPI

[LiveImg]
BootType=Windows2003
SystemPath=\reactos
Options=/FASTDETECT /MININT

[LiveImg_NoLinux]
BootType=Windows2003
SystemPath=\reactos
Options=/FASTDETECT /MININT /NOLINUXKPI

[Setup_RamDisk]
BootType=ReactOSSetup
SystemPath=ramdisk(0)
Options=/RDPATH= /RDEXPORTASCD

[LiveImg_RamDisk]
BootType=Windows2003
SystemPath=ramdisk(0)\reactos
Options=/FASTDETECT /MININT /RDPATH= /RDEXPORTASCD
;Options=/FASTDETECT /MININT /RDPATH=liveimg.iso /RDEXPORTASCD

; Loads the Linux GPU group (DRM + amdgpu) once the system volume is mounted. Debug output goes to the screen; the
; Linux driver log also goes to X:\LKPILOG.TXT on any FAT volume (a second USB stick) where that empty file exists.
[LiveImg_Gpu]
BootType=Windows2003
SystemPath=ramdisk(0)\reactos
Options=/FASTDETECT /MININT /RDPATH= /RDEXPORTASCD /LINUXKPI_GPU /DEBUG /DEBUGPORT=SCREEN /SOS

[LiveImg_Debug]
BootType=Windows2003
SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /FASTDETECT /MININT

[LiveImg_VBoxDebug]
BootType=Windows2003
SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=VBOX /SOS /FASTDETECT /MININT

[LiveImg_Screen]
BootType=Windows2003
SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=SCREEN /SOS /FASTDETECT /MININT

;[LiveImg_LogFile]
;BootType=Windows2003
;SystemPath=\reactos
;Options=/DEBUG /DEBUGPORT=FILE:\Device\HarddiskX\PartitionY\debug.log /SOS /FASTDETECT /MININT
